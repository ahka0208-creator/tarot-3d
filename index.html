<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌌 3D 塔羅全方位占卜 (完整版)</title>
    <style>
        :root {
            --bg-dark: #0b0c10;
            --bg-light: #1f2833;
            --gold: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.5);
            --text-main: #c5c6c7;
            --card-width: 200px;
            --card-height: 310px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at top center, var(--bg-light) 0%, var(--bg-dark) 100%);
            color: var(--text-main);
            margin: 0;
            padding: 20px 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        h2 {
            color: var(--gold);
            text-align: center;
            font-size: 26px;
            letter-spacing: 2px;
            text-shadow: 0 0 15px var(--gold-glow);
            margin-top: 10px;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #8a9ba8;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* 3D 卡牌舞台 */
        .scene {
            width: var(--card-width);
            height: var(--card-height);
            perspective: 1200px;
            margin: 0 auto 20px auto;
            position: relative;
            z-index: 5;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 15px;
        }

        /* 翻牌動畫 Class */
        .card.is-flipped {
            transform: translateY(-15px) rotateY(180deg) scale(1.05);
            box-shadow: 0 20px 40px var(--gold-glow);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px solid var(--gold);
            box-sizing: border-box;
        }

        /* 牌背設計 */
        .card-face-back {
            background: linear-gradient(135deg, #111 0%, #2b1b3d 100%);
            background-image: repeating-linear-gradient(45deg, rgba(212,175,55,0.05) 0, rgba(212,175,55,0.05) 2px, transparent 2px, transparent 8px);
        }
        
        .mystic-circle {
            width: 100px;
            height: 100px;
            border: 2px dashed var(--gold);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 45px;
            animation: spin 20s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* 牌面設計 */
        .card-face-front {
            background: #fdfbf7;
            transform: rotateY(180deg);
            color: #111;
            padding: 15px;
        }

        .card-image-placeholder {
            font-size: 65px;
            margin-bottom: 20px;
            text-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .card-name {
            font-size: 18px;
            font-weight: bold;
            color: #2b1b3d;
            text-align: center;
            border-top: 2px solid var(--gold);
            border-bottom: 2px solid var(--gold);
            padding: 5px 0;
            width: 90%;
            letter-spacing: 1px;
        }

        .card-number {
            position: absolute;
            top: 15px;
            font-size: 18px;
            font-family: serif;
            color: #888;
        }

        /* 分析結果區 */
        .analysis-section {
            width: 100%;
            max-width: 450px;
            background: rgba(31, 40, 51, 0.85);
            border-left: 4px solid var(--gold);
            padding: 20px;
            border-radius: 0 12px 12px 0;
            margin-top: 10px;
            margin-bottom: 30px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s ease;
            display: none;
            box-sizing: border-box;
            max-height: 50vh;
            overflow-y: auto;
        }

        .analysis-section::-webkit-scrollbar { width: 6px; }
        .analysis-section::-webkit-scrollbar-thumb { background-color: var(--gold); border-radius: 10px; }
        .analysis-section.show { opacity: 1; transform: translateY(0); }

        .category-title {
            color: var(--gold);
            font-size: 17px;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 5px;
        }
        .category-title:first-of-type { margin-top: 0; }
        .analysis-content { font-size: 15px; line-height: 1.6; color: #d1d5db; }
        .keywords {
            display: inline-block;
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .action-btn {
            background: transparent;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            margin-bottom: 10px;
            transition: all 0.3s;
            display: none;
            width: 100%;
            max-width: 250px;
        }
        .action-btn:hover, .action-btn:active { background: var(--gold); color: #0b0c10; }
        
        #instruction {
            color: var(--gold);
            margin-top: 10px;
            font-size: 16px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    </style>
</head>

    let isDrawing = false;
    let hasDrawn = false;

    function drawCard() {
        if (isDrawing || hasDrawn) return;
        isDrawing = true;
        hasDrawn = true;

        const card = document.getElementById('tarotCard');
        const instruction = document.getElementById('instruction');
        const subtitle = document.getElementById('subtitleText');
        const analysisSection = document.getElementById('analysisSection');
        const resetBtn = document.getElementById('resetBtn');

        instruction.style.display = 'none';
        subtitle.style.display = 'none';

        const randomIndex = Math.floor(Math.random() * tarotDeck.length);
        const selected = tarotDeck[randomIndex];

        document.getElementById('cardNumber').innerText = selected.num;
        document.getElementById('cardImage').innerText = selected.icon;
        document.getElementById('cardName').innerText = selected.name;

        card.classList.add('is-flipped');

        setTimeout(() => {
            document.getElementById('cardKeywords').innerText = `【 核心牌義 】 ${selected.keywords}`;
            document.getElementById('careerText').innerText = selected.career;
            document.getElementById('loveText').innerText = selected.love;
            document.getElementById('familyText').innerText = selected.family;

            analysisSection.style.display = 'block';
            resetBtn.style.display = 'block'; 
            
            setTimeout(() => {
                analysisSection.classList.add('show');
                isDrawing = false;
            }, 50);
        }, 1200);
    }

    function resetCard() {
        if (isDrawing) return;
        
        const card = document.getElementById('tarotCard');
        const analysisSection = document.getElementById('analysisSection');
        const instruction = document.getElementById('instruction');
        const subtitle = document.getElementById('subtitleText');
        const resetBtn = document.getElementById('resetBtn');

        analysisSection.classList.remove('show');
        resetBtn.style.display = 'none';
        
        setTimeout(() => {
            analysisSection.style.display = 'none';
            card.classList.remove('is-flipped');
            
            setTimeout(() => {
                instruction.style.display = 'block';
                subtitle.style.display = 'block';
                hasDrawn = false;
            }, 1000);
        }, 500);
    }
</script>
