<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌌 塔羅全方位運程 (大牌展示版)</title>
    <style>
        :root {
            --bg-dark: #07080a;
            --bg-light: #1a222c;
            --gold: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.4);
            --text-main: #c5c6c7;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at top center, var(--bg-light) 0%, var(--bg-dark) 100%);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        h2 {
            color: var(--gold);
            text-align: center;
            font-size: 26px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--gold-glow);
            margin-top: 10px;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            font-size: 15px;
            color: #8a9ba8;
            margin-bottom: 30px;
            line-height: 1.5;
            height: 45px;
        }

        /* 互動區域：抽牌堆 / 展示大牌 */
        .stage {
            width: 100%;
            max-width: 300px;
            height: 380px; /* 特大卡牌尺寸 */
            position: relative;
            perspective: 1200px;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 牌堆設計 (Stack) */
        .deck-stack {
            position: absolute;
            width: 180px;
            height: 280px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .deck-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            background: linear-gradient(135deg, #111 0%, #2b1b3d 100%);
            background-image: repeating-linear-gradient(45deg, rgba(212,175,55,0.05) 0, rgba(212,175,55,0.05) 2px, transparent 2px, transparent 8px);
            border: 2px solid var(--gold);
            box-shadow: -3px 3px 10px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s ease;
        }

        .deck-stack:hover .deck-layer:nth-child(3) { transform: translate(-5px, -5px); border-color: #fff; box-shadow: 0 0 15px var(--gold-glow); }
        .deck-stack:hover .deck-layer:nth-child(2) { transform: translate(-2px, -2px); }

        /* 特大展示卡牌 */
        .display-card {
            width: 220px;
            height: 340px;
            position: absolute;
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s;
            opacity: 0;
            pointer-events: none; /* 展示時不可點擊 */
        }

        .display-card.show {
            opacity: 1;
            transform: rotateY(180deg) scale(1.1); /* 翻開並放大 */
            box-shadow: 0 20px 40px var(--gold-glow);
            z-index: 100;
        }

        .display-card.shrink {
            transform: rotateY(180deg) scale(0.6) translateY(-50px); /* 縮細移上 */
            opacity: 0;
            transition: transform 0.8s, opacity 0.8s;
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 12px;
            border: 2px solid var(--gold);
            box-sizing: border-box;
        }

        .card-face-back {
            background: linear-gradient(135deg, #111 0%, #2b1b3d 100%);
            background-image: repeating-linear-gradient(45deg, rgba(212,175,55,0.05) 0, rgba(212,175,55,0.05) 2px, transparent 2px, transparent 8px);
            display: flex; justify-content: center; align-items: center;
        }
        
        .mystic-circle {
            width: 60px; height: 60px;
            border: 2px dashed var(--gold);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 30px;
            animation: spin 10s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* 復古大牌正面 */
        .card-face-front {
            background: linear-gradient(135deg, #eaddc5 0%, #d4c098 100%);
            box-shadow: inset 0 0 30px rgba(90, 60, 20, 0.7);
            transform: rotateY(180deg);
            padding: 10px;
            border: 1px solid #111;
        }

        .card-front-inner {
            width: 100%; height: 100%;
            border: 2px solid #5a4628; border-radius: 6px;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            padding: 10px; box-sizing: border-box; background: rgba(255, 255, 255, 0.15);
        }

        .card-image-frame {
            width: 100%; flex: 1; margin-bottom: 10px; border: 2px solid #8b6e41;
            background: radial-gradient(circle, #fdfbf7 0%, #eaddc5 100%);
            display: flex; justify-content: center; align-items: center;
            border-radius: 4px; box-shadow: inset 0 0 15px rgba(0,0,0,0.2);
        }

        .card-image-placeholder { font-size: 80px; filter: drop-shadow(4px 6px 5px rgba(0,0,0,0.5)); }

        .card-name {
            font-size: 16px; font-family: "Georgia", serif; font-weight: bold; color: #2b1b3d;
            text-align: center; border-top: 2px solid #5a4628; border-bottom: 2px solid #5a4628; 
            padding: 6px 0; width: 100%; letter-spacing: 2px; background: rgba(255,255,255,0.3);
        }

        /* 獨立顯示的解析區 */
        .analysis-container {
            width: 100%; max-width: 500px;
            display: none; flex-direction: column;
            animation: fadeInUp 0.8s forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .analysis-block {
            background: rgba(31, 40, 51, 0.9);
            border-left: 4px solid var(--gold);
            padding: 25px 20px;
            border-radius: 0 12px 12px 0;
            box-sizing: border-box;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .block-title {
            color: var(--gold); font-size: 18px; font-weight: bold;
            margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3); padding-bottom: 8px;
        }
        .block-card-name {
            font-size: 16px; font-weight: bold; color: #fff; margin-bottom: 12px;
            display: inline-block; background: rgba(212, 175, 55, 0.25);
            padding: 4px 12px; border-radius: 6px; letter-spacing: 1px;
        }
        .block-desc { font-size: 16px; line-height: 1.8; color: #e0e0e0; text-align: justify; }

        .action-btn {
            background: linear-gradient(135deg, var(--gold) 0%, #b8860b 100%);
            color: #111; font-weight: bold; border: none;
            padding: 16px 30px; border-radius: 30px; font-size: 18px;
            cursor: pointer; transition: all 0.2s; width: 100%; max-width: 300px;
            margin: 25px auto; display: none; box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }
        .action-btn:active { transform: scale(0.95); }
        .action-btn.outline {
            background: transparent; color: var(--gold); border: 2px solid var(--gold); margin-top: 10px;
        }

    </style>
</head>
<body>

    <h2>🌌 塔羅全方位運程</h2>
    <div class="subtitle" id="subtitleText">深呼吸，這是一場與宇宙的對話。<br>請點擊下方牌堆，抽取第一張【事業牌】。</div>

    <div class="stage" id="stage">
        <!-- 點擊抽牌的牌堆 -->
        <div class="deck-stack" id="deckStack" onclick="drawNextCard()">
            <div class="deck-layer" style="transform: translate(10px, 10px);"></div>
            <div class="deck-layer" style="transform: translate(5px, 5px);"></div>
            <div class="deck-layer">
                <div class="mystic-circle">🔯</div>
            </div>
        </div>

        <!-- 展示大牌 -->
        <div class="display-card" id="displayCard">
            <div class="card-face card-face-back"><div class="mystic-circle">🔯</div></div>
            <div class="card-face card-face-front">
                <div class="card-front-inner">
                    <div class="card-image-frame"><div class="card-image-placeholder" id="cardIcon"></div></div>
                    <div class="card-name" id="cardName"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 解析區 -->
    <div class="analysis-container" id="analysisContainer">
        <div class="analysis-block">
            <div class="block-title" id="stageTitle">💼 【事業與學業發展】</div>
            <div class="block-card-name" id="stageCardName"></div>
            <div class="block-desc" id="stageDesc"></div>
        </div>
        
        <button class="action-btn" id="nextBtn" onclick="prepareNextStage()">繼續抽取下一張</button>
        <button class="action-btn outline" id="resetBtn" onclick="resetAll()">🔄 重新開始測算</button>
    </div>

<script>

        { n: "0. 愚者", i: "🃏",

          l: "感情充滿新鮮感與變數。單身者可能在旅途或陌生環境遇到有趣的人；有伴侶者需為關係注入驚喜，隨心而行，不要給彼此太大壓力。",

        { n: "II. 女祭司", i: "🌙",

          f: "家庭氣氛溫和融洽。之前如果有摩擦或誤會，現在是最佳的調解時機，大家都能理性溝通、各退一步，達到完美的和睦狀態。" },
        { n: "XV. 惡魔", i: "⛓️", 
          c: "你可能因為過度追求金錢、權力而陷入高壓，甚至面臨職場上的不道德誘惑或辦公室政治。小心被工作綁架，失去了生活與選擇的自由。", 
          l: "充滿強烈的肉體吸引力，但可能是一段不健康的「孽緣」。注意控制欲過強、互相猜忌，或者僅僅建立在物質利益與情慾上的依賴關係。", 
          f: "家庭可能會因為金錢利益分配、遺產糾紛，或某些不良習慣（如沉迷賭博、過度消費、情緒勒索）而產生嚴重糾紛。需要及時斬斷惡性循環。" },
        { n: "XVI. 高塔", i: "⚡", 
          c: "小心突如其來的巨大衝擊！可能是公司無預警裁員、計畫被迫中斷或犯下大錯。雖然令人震驚痛苦，但這同時也摧毀了限制你的錯誤基礎。", 
          l: "可能會有突發的激烈爭吵，或者隱藏已久的秘密（如背叛、謊言）突然曝光。這是一個打破虛假和平的時刻，必須勇敢直面最真實、最殘酷的問題。", 
          f: "家中可能發生意料之外的突發事件或激烈衝突。雖然一時之間會感到極度混亂與崩潰，但這是一次大破大立的契機，逼迫大家面對並解決現實。" },
        { n: "XVII. 星星", i: "🌟", 
          c: "前景光明，充滿希望。這段時期特別利於從事藝術、創意、科技或療癒相關的工作。你之前的努力終於看到了曙光，請跟隨內心願景前進。", 
          l: "感情關係和諧美好，充滿了心靈上的高度契合。單身者對愛情抱持美好的憧憬，易吸引靈魂伴侶；有伴侶者之間的誤會將被治癒，步入平靜期。", 
          f: "家庭氛圍如星空般寧靜祥和。之前的隔閡或爭吵將會得到完美的療癒與釋懷。這是一個適合全家人聚在一起，互相傾訴心聲、修復關係的好時刻。" },
        { n: "XVIII. 月亮", i: "🌕", 
          c: "職場局勢不明朗，可能存在隱藏的風險、潛規則或背後的小人。這段時間絕對不宜做重大決定，事情並不如表面所見，需小心謹慎觀察。", 
          l: "感情中充滿了不安、猜忌與恐懼。你可能因為過度敏感而產生幻覺，或者對方有些事情沒有坦白。請冷靜留意自己的情緒起伏，不要妄下定論。", 
          f: "家中可能有一些不願意公開的秘密、財務隱憂或難以啟齒的問題。家人之間可能缺乏安全感，容易因為誤會而產生情緒化的過激反應。" },
        { n: "XIX. 太陽", i: "☀️", 
          c: "大吉大利！你的工作將獲得極大的成功與認可。專案順利落地、有機會升職加薪，你的才華和努力都會被看見。保持你的熱情與活力向前衝！", 
          l: "熱情如火，關係完全明朗化。這是一個充滿喜悅的時刻，非常適合公開戀情、見家長、結婚甚至孕育新生命。沒有隱瞞，只有純粹的愛與快樂。", 
          f: "家中充滿了歡聲笑語，陽光普照。近期可能有喜事臨門（如添丁、金榜題名），家庭關係極其融洽。這股正能量會感染所有人，是享受天倫的大好時光。" },
        { n: "XX. 審判", i: "🎺", 
          c: "這是一個總結與評估的關鍵時刻。過去的努力即將得到最終的評判；如果你之前經歷過失敗或低潮，現在是重整旗鼓、東山再起的大好時機。", 
          l: "關係面臨關鍵的十字路口。可能是破鏡重圓、解開多年的心結，或者是徹底放下過去不適合的人，迎來感情觀念上的自我覺醒與解脫。", 
          f: "家庭中過去遺留的歷史問題或恩怨即將得到最終解決。這是一個互相原諒、放下執念，讓家庭關係重獲新生、迎來大團圓的覺醒時刻。" },
        { n: "XXI. 世界", i: "🌍", 
          c: "完美達標！你負責的項目將圓滿結束，獲得極高的讚譽與實質回報。這是一個階段性的完美終點，你已經準備好迎接下一個更高層次的挑戰與旅程。", 
          l: "感情開花結果，達到最和諧完美的狀態。這張牌強烈暗示著婚姻的承諾、修成正果，或者雙方找到了最適合彼此、無可挑剔的生活方式。", 
          f: "家庭生活幸福圓滿。一切都處於最佳狀態，家人之間充滿包容與滿滿的愛，居住環境舒適，你對目前的家庭狀況感到無比的安全、富足與感恩。" },
        
        { n: "權杖一", i: "🔥", c: "靈感爆發！開啟新計畫、創業或轉行的大好時機，大膽去執行你的點子吧。", l: "感情迎來熱情火花。單身易一見鍾情；有伴侶者找回激情，充滿新鮮感。", f: "家庭充滿生機，可能有新成員加入、搬家或裝修，大家對未來充滿動力。" },
        { n: "權杖二", i: "🔥", c: "你擁有一定基礎，面臨選擇或海外發展的機會。勇敢放眼長遠目標，勿局限現狀。", l: "面臨感情抉擇，如在對象間猶豫，或考慮長遠未來（如異地戀或出國發展）。", f: "規劃家庭長遠未來，如子女升學、移民或跨城市搬遷，需宏觀權衡利弊。" },
        { n: "權杖三", i: "🔥", c: "努力開始見效，準備迎接更廣闊的發展與合作機會。有利拓展海外市場。", l: "感情充滿希望，雙方對未來有共同藍圖，是一段能共同成長的健康關係。", f: "家庭生活穩定期，有向外擴展跡象。家族事業順利或有來自遠方的好消息。" },
        { n: "權杖四", i: "🔥", c: "達成重要里程碑！如試用期通過或專案完工。值得慶祝，已建立穩固基礎。", l: "關係極其穩定歡樂。代表同居、訂婚或婚禮，在祝福下邁向新階段。", f: "家庭和睦，充滿節慶氣氛。適合舉辦家族聚會，家庭提供強大的避風港。" },
        { n: "權杖五", i: "🔥", c: "充滿競爭、混亂與分歧，每個人都想爭主導權。需透過積極溝通與良性競爭突破。", l: "容易因小事或面子發生口角。非致命危機，但需放下自尊尋求和解。", f: "家中因意見不合而吵鬧，難以妥協。需要一個客觀的人主持大局平息紛爭。" },
        { n: "權杖六", i: "🔥", c: "勝利與榮耀！努力獲認可，可能受表揚、升職。充滿自信與好消息的時刻。", l: "在感情競爭中脫穎而出。有伴侶者會因另一半成就感到驕傲，備受祝福。", f: "家人為你的成就自豪。可能有人升學、升職，為家庭帶來榮光與歡樂。" },
        { n: "權杖七", i: "🔥", c: "面臨挑戰與反對聲音，需捍衛立場。保持自信，你有足夠能力抵禦外界壓力。", l: "關係可能不被看好或面臨情敵。需堅定心意捍衛感情，不要輕言放棄。", f: "在家庭決策中需獨排眾議，堅持對的方向。雖受質疑，請用實力證明。" },
        { n: "權杖八", i: "🔥", c: "進展極快，障礙消除！突收重要消息或專案加速推進，是乘勝追擊好時機。", l: "發展突飛猛進，如閃電戀愛、熱烈網戀。溝通頻繁順暢，充滿激情火花。", f: "突有許多事需同時處理，或突發探訪。節奏快，但一切朝積極方向發展。" },
        { n: "權杖九", i: "🔥", c: "疲憊不堪滿身傷痕，但距成功只差最後一步。保持警覺咬緊牙關，切勿放棄。", l: "受過傷導致築起心牆，對關係充滿戒心與防備。需要時間重建信任。", f: "為家庭重擔苦撐很久。雖心力交瘁，但保護了這個家，請堅守最後防線。" },
        { n: "權杖十", i: "🔥", c: "承擔過多責任，被壓得喘不過氣，影響健康。需學會授權或勇敢說「不」。", l: "感情沉重無比，責任大於快樂。單方面承擔壓力，需坦誠溝通尋求分擔。", f: "所有家計瑣事壓在肩上。不要一個人硬撐，適當向家人示弱尋求幫助。" },
        { n: "權杖侍者", i: "🔥", c: "收到新工作或項目的好消息。帶著初生之犢不畏虎的精神去探索，保持熱忱。", l: "充滿新鮮感的戀愛萌芽。遇見充滿活力喜歡冒險的對象，注入活潑元素。", f: "年輕成員帶來充滿活力的好消息，或家庭開展令人興奮的新計畫。" },
        { n: "權杖騎士", i: "🔥", c: "充滿幹勁行動迅速！適合開拓新市場，但需注意勿因急躁或衝動忽略細節。", l: "一段熱烈但短暫的戀情。對方熱情主動，但可能缺乏長遠承諾與耐性。", f: "面臨突發改變或搬遷，行動力高。家人可能因衝動有小摩擦，但很快和好。" },
        { n: "權杖王后", i: "🔥", c: "積極樂觀且充滿魅力。極佳人際手腕與溫暖性格，能輕易帶動團隊士氣。", l: "關係中展現自信獨立且熱情。這是一段成熟且充滿活力的關係，互相支持。", f: "有位溫暖開朗的女性長輩維持和諧。氣氛充滿歡樂正能量，令人賓至如歸。" },
        { n: "權杖國王", i: "🔥", c: "展現果斷領導力與魄力。以宏觀視野與堅定意志掌控全局，達成目標。", l: "一方處於主導地位，熱情慷慨但略帶霸道。雙方坦誠直接，不拐彎抹角。", f: "權威人士作出果斷決定。用強大能力與資源保護家庭，嚴格但充滿熱忱。" },

        { n: "聖杯一", i: "🍷", c: "充滿熱情與靈感的新項目展開。氛圍和諧，對目前工作感到發自內心的滿足。", l: "情感滿溢！深刻的新戀情萌芽，或現有關係迎來心靈契合，感到無比幸福。", f: "充滿愛與包容。可能有新生命、領養寵物，或家人解開心結達成深層連結。" },
        { n: "聖杯二", i: "🍷", c: "極佳的合作關係。地位平等、優勢互補，利於簽約、合夥或一對一客戶洽談。", l: "平等的結合。充滿愛、互相理解且極具吸引力的關係，眼裡只有彼此。", f: "家人之間（如夫妻/手足）關係融洽和睦，互相傾聽支持，決策一致同意。" },
        { n: "聖杯三", i: "🍷", c: "團隊合作無間，氣氛輕鬆。專案成功後，適合與同事舉辦慶功宴分享喜悅。", l: "感情多姿多采，可能透過聚會認識新對象。但也需注意牽涉第三方的可能。", f: "歡聚時刻！家中有喜事（婚禮、生日），親友相聚，充滿歡樂社交氛圍。" },
        { n: "聖杯四", i: "🍷", c: "對工作感到枯燥缺乏動力。陷入職業倦怠，甚至忽略了身邊的新機會或貴人。", l: "對感情現狀不滿或無聊，進入冷淡期。封閉自己，不願接受示好或新戀情。", f: "家庭生活一成不變感到沉悶。對關心感到麻木，需重新尋找生活的熱情。" },
        { n: "聖杯五", i: "🍷", c: "項目失敗錯失良機，感到強烈失落懊悔。別只盯著失去的，你仍有翻盤資源。", l: "經歷分手背叛或失望，沉浸過去無法自拔。明白這非全部，仍有愛你的人。", f: "家庭經歷損失或傷心變故。雖然遺憾，但家人情感並未斷裂，請珍惜眼前人。" },
        { n: "聖杯六", i: "🍷", c: "過去經驗或舊同事將帶來幫助。環境充滿人情味，或從事與懷舊、兒童相關行業。", l: "回憶與純真之愛。可能與舊情人重逢或青梅竹馬發展。充滿照顧與安全感。", f: "充滿懷舊溫馨氣氛。適合回鄉探親、翻舊相簿，長輩對晚輩展現無微不至的照顧。" },
        { n: "聖杯七", i: "🍷", c: "面前有誘人機會，但多是虛幻畫大餅。需保持清醒，評估風險做出實際選擇。", l: "在曖昧對象中猶豫，或抱有不切實際的浪漫幻想。看清真面目，勿愛上幻想。", f: "對家庭未來有不切實際計畫（如超預算買房）。需務實討論可行性，避免好高騖遠。" },
        { n: "聖杯八", i: "🍷", c: "工作穩定但無法滿足內心。決定放棄現有成就，勇敢轉行離職，追尋更高目標。", l: "現狀無法滿足心靈，即使平靜，仍決定離開沒有靈魂的關係，尋找深層意義。", f: "因理念不合或尋求獨立，決定搬離原生家庭。這是為追尋成長主動遠離舒適圈。" },
        { n: "聖杯九", i: "🍷", c: "事業心願達成！對成就感到極度自豪滿意。代表「美夢成真」，享受豐碩成果。", l: "感情達到夢寐以求狀態。單身者享受單身貴族生活；有伴侶者獲得極大滿足。", f: "家庭生活舒適奢華，物質豐裕。家人充滿歡樂滿足，是令人稱羨的幸福狀態。" },
        { n: "聖杯十", i: "🍷", c: "在極具向心力像大家庭般的團隊工作，同事互相扶持，帶來長遠安全與滿足感。", l: "和諧的終極象徵！關係最幸福狀態，充滿愛與長遠承諾，適合步入婚姻共組家庭。", f: "家庭關係完美寫照。幾代同堂其樂融融，家庭提供最強大心靈避風港與無條件支持。" },
        { n: "聖杯侍者", i: "🍷", c: "直覺敏銳充滿想像力。收到關於合作或藝術創作好消息。需運用感性創意處理。", l: "溫柔浪漫新戀情萌芽。對象年輕或充滿藝術氣息。真誠單純需小心呵護的情感。", f: "關於懷孕、新生兒降臨，或年輕成員帶來好消息。家庭氣氛變得柔和充滿感情。" },
        { n: "聖杯騎士", i: "🍷", c: "充滿詩意感性，收到友善提案邀請。適合外交公關或藝術工作，用魅力說服他人。", l: "白馬王子般浪漫追求！魅力深情懂製造驚喜。但可能過於理想化，現實稍顯不足。", f: "出現擔任調解員角色的人，用同理心化解矛盾。可能有愉快家庭聚會或浪漫旅行。" },
        { n: "聖杯王后", i: "🍷", c: "運用極強直覺與同理心處理事務。善解人意，適合輔導、人資或情感交流服務業。", l: "展現無限溫柔、包容與支持。心靈高度契合，能互相療癒彼此創傷的深刻關係。", f: "充滿母性光輝極具同理心的長輩。是家庭情感支柱，敏銳察覺需要並給予無私的愛。" },
        { n: "聖杯國王", i: "🍷", c: "完美平衡理智與情感的領導者。圓融世故，充滿智慧的傾聽者，輕易化解糾紛贏人心。", l: "對方成熟、深情且情緒極度穩定。不輕易表露情緒，但用包容與智慧維護感情。", f: "父親或長輩扮演穩定軍心角色。充滿智慧情緒穩定，溫和具威嚴提供強大心靈庇護。" },

        { n: "寶劍一", i: "⚔️", c: "清晰思考與決斷。用理智斬斷迷霧，極佳突破口，新思維計畫帶來巨大優勢。", l: "需絕對坦誠與理智溝通。不適合感性，可能需做出冷靜無情的決定，斬斷不合適關係。", f: "拋開情緒勒索，用最客觀理性方式解決家庭問題。把話說清楚並定立清晰規則。" },
        { n: "寶劍二", i: "⚔️", c: "陷入僵局，勢力互相牽制。自我蒙蔽不願面對現實，卡在兩難中，必須鼓起勇氣決定。", l: "處於冷戰或停滯。雙方不願妥協面對核心問題。逃避無法解決危機，必須坦誠相對。", f: "存在「粉飾太平」氣氛。為避免衝突選擇沉默，但問題仍在，需勇敢打破僵局。" },
        { n: "寶劍三", i: "⚔️", c: "面臨嚴厲批評、背叛或計畫受挫，言語中傷感痛苦。保持冷靜汲取教訓，勿被情緒擊垮。", l: "面臨心碎時刻，可能有第三者、嚴重爭吵分離。雖然痛苦，但直面真相是成長必經路。", f: "有激烈言語衝突或傷心消息，氣氛低迷。避免情緒激動時互相傷害，給予空間平復。" },
        { n: "寶劍四", i: "⚔️", c: "長期高壓戰鬥後筋疲力盡。需要強制暫停一切，請假休息，讓身心恢復能量後再出發。", l: "進入「冷靜期」。雙方都累了，暫時隔離退卻是為讓彼此有時間沉澱思考未來的路。", f: "經歷風波後進入休養生息階段。保持安靜平和，不要在此刻挑起任何新話題或爭端。" },
        { n: "寶劍五", i: "⚔️", c: "充滿敵意自私的環境。贏了爭論卻失去人心合作機會。注意辦公室政治與惡意中傷。", l: "充斥為贏而贏的無意義爭執。口舌佔上風卻深深傷害感情。放下自尊，避免兩敗俱傷。", f: "爆發嚴重衝突，互相推卸責任爭奪利益。這種爭吵沒有贏家，只會讓家庭分崩離析。" },
        { n: "寶劍六", i: "⚔️", c: "帶著過往創傷，但最壞情況已過。逐漸駛向平靜水域，可能有職務調動、出差或穩定復甦。", l: "度過最艱難危機，帶著傷痕決定共同走向未來。互相扶持、慢慢療癒並遠離紛爭。", f: "從巨大悲傷變故中慢慢恢復。可能需搬離傷心地，或全家共同進行平靜旅行治癒心靈。" },
        { n: "寶劍七", i: "⚔️", c: "有人試圖取巧、走捷徑欺瞞解決問題，甚至竊取成果。保持警覺，自己也切忌因貪圖方便犯錯。", l: "充滿不誠實與逃避。一方可能說謊隱瞞（如劈腿），或用狡猾方式逃避承諾責任。", f: "有人對財務或私事隱瞞，導致信任危機。面對家庭責任，不能只顧自己輕鬆而推卸。" },
        { n: "寶劍八", i: "⚔️", c: "覺得被困住無路可退。但綁住你的只是內心恐懼與過度思慮，只要轉換心態，隨時能掙脫。", l: "感到強烈窒息感與不自由，覺得是受害者。實際上是畫地為牢，不願正視離開的可能性。", f: "家庭規矩或長輩期望像繩索綑綁你。感到無力反抗，只要勇敢表達真實想法，束縛並不存在。" },
        { n: "寶劍九", i: "⚔️", c: "壓力大到失眠極度焦慮。被過度擔憂與噩夢折磨，但多半是自己幻想出來的恐懼，並非現實。", l: "備受折磨，內心充滿恐懼、猜忌與不安全感。深夜反覆煎熬，需停止內耗尋求外界開導。", f: "因擔心家人健康或財務狀況憂心忡忡。焦慮嚴重影響生活品質，請與家人坦白不要獨撐。" },
        { n: "寶劍十", i: "⚔️", c: "遭遇徹底結束與谷底，如被解雇或公司倒閉。情況壞到極點，但也代表痛苦終結，重生就在不遠處。", l: "帶來巨大痛苦並慘烈結束的關係。已無挽回餘地，接受殘酷結局是邁向新生的唯一方法。", f: "經歷毀滅性打擊或痛苦分裂。一切跌至谷底不可能再壞了。收拾殘局，讓時間慢慢撫平創傷。" },
        { n: "寶劍侍者", i: "⚔️", c: "思想敏捷，善於收集資訊分析。可能收到重要合約或法律文件。機警但需注意溝通勿過於尖銳。", l: "對方聰明機智防備心重。充滿言語交鋒與試探，缺乏感性交流，需小心溝通以免傷人。", f: "年輕成員可能過於叛逆或言辭犀利。需要理性溝通，留意是否有未經證實的流言蜚語傳播。" },
        { n: "寶劍騎士", i: "⚔️", c: "勇往直前果斷敏捷！適合處理突發危機或推行改革。但需避免魯莽行事及欠缺耐性得罪人。", l: "發展迅速，對方腦筋轉得快，但可能缺同理心與浪漫。容易因衝動發生激烈爭吵，來得快去得快。", f: "有突發變故需迅速處理。某個家人以強勢急躁態度介入，帶來了混亂但也解決了問題。" },
        { n: "寶劍王后", i: "⚔️", c: "理智冷靜獨立。不被情感左右，客觀銳利看透本質。適合從事法律、審計或需要極高邏輯的工作。", l: "表現極為冷靜甚至冷酷。要求絕對誠實與空間，不喜歡黏膩關係，會果斷斬斷不適合的緣分。", f: "嚴厲、講求邏輯與原則的女性長輩。雖然言語犀利不留情面，但能提供最客觀正確的建議指引。" },
        { n: "寶劍國王", i: "⚔️", c: "權威嚴謹與極強邏輯判斷力。以公平嚴格掌控大局，是具專業知識的領導者。必須遵守嚴格規範。", l: "極其理性、講求原則且不擅表達情感。關係建立在互相尊重與智力匹配上，不要用情緒勒索。", f: "具備絕對權威的長輩。以嚴格家規高標準要求家人，家庭事務需要透過理智與邏輯進行討論。" },

        { n: "錢幣一", i: "🪙", c: "極佳物質與財務新機遇！如獲利豐厚新工作、加薪創業。務實開端，穩紮穩打為未來帶來豐碩成果。", l: "建立在穩固現實基礎的新戀情。不僅有情感交流，金錢觀念與目標高度契合，能長遠發展。", f: "財務狀況迎來新轉機，可能有買房、獲得遺產或收入增加好消息。生活物質條件得到實質提升。" },
        { n: "錢幣二", i: "🪙", c: "在多項任務或財務狀況中玩拋接球。需極高靈活度與時間管理維持動態平衡。可能有兼職或資金周轉需求。", l: "在兩個對象之間游移不定，或在愛情與麵包間努力尋求平衡。關係充滿起伏變化，需要適應力。", f: "財務面臨需要靈活調度狀況。家人需兼顧工作與家庭生活，在忙碌中努力維持日常運作平衡。" },
        { n: "錢幣三", i: "🪙", c: "團隊合作最佳典範！透過專業結合與良好溝通，打造出高質量成果。有利建築、設計或專案開發。", l: "猶如「合夥人」般的感情。分工明確，為共同未來目標打拼。關係在互相學習建設中變得穩固。", f: "齊心協力完成大工程（如房屋裝修、籌辦婚禮）。發揮各自專長，溝通順暢，家庭凝聚力極強。" },
        { n: "錢幣四", i: "🪙", c: "保守固執。為安全感緊抓現有資源不放，不願冒險投資或分享權力。過度封閉守舊阻礙新機會流入。", l: "佔有慾極強，或過於計較金錢付出。不願向對方敞開心扉防備心重，這種窒息的愛讓關係難以成長。", f: "對金錢極度保守甚至吝嗇。過度保護既有財產，缺乏情感交流與慷慨，氣氛顯得死氣沉沉。" },
        { n: "錢幣五", i: "🪙", c: "面臨嚴重財務危機、失業或物質貧乏。在職場感到孤立無援。請放下自尊尋求幫助，不要獨自硬撐。", l: "共同面臨現實生活巨大考驗（如經濟困難、健康問題）。若能患難與共，關係將會變得堅不可摧。", f: "正面臨物質或健康上的寒冬。可能負債遭遇困境，家人必須團結一致互相扶持，熬過艱難歲月。" },
        { n: "錢幣六", i: "🪙", c: "慷慨分享與資源平衡。可能獲得獎金、資助；或有能力指導幫助下屬，達成職場上的雙贏局面。", l: "存在「施與受」的動態平衡。一方可能在物質情感照顧較多。只要雙方感到滿意感恩，就是健康關係。", f: "財務狀況充裕，長輩可能給予晚輩金錢援助禮物。家人樂於互相分享資源，充滿慷慨感恩氣氛。" },
        { n: "錢幣七", i: "🪙", c: "付出了很多努力，現在是等待收成與重新評估的時刻。不要急於求成，停下來思考下一步長遠發展。", l: "發展到穩定期，你正在思考關係的長遠未來與回報。這是需要耐心培養的階段，不要急著要求承諾。", f: "家庭長期投資（如子女教育、置業計畫）正在穩步成長。這是需要耐心等待成果的時期，保持平穩。" },
        { n: "錢幣八", i: "🪙", c: "專注、勤奮且一絲不苟。投入工作學習新技能，持續的努力累積將造就卓越專業度，工匠精神體現。", l: "雙方非常務實地為未來打拼，專注工作而忽略浪漫。這是透過實際行動默默付出建立起來的穩定關係。", f: "家人都在各自崗位努力工作勤奮賺錢。雖然缺乏驚喜與娛樂，但充滿了踏實感與為未來奮鬥的動力。" },
        { n: "錢幣九", i: "🪙", c: "事業財務雙重豐收！建立起獨立穩固的事業版圖，享受自己努力得來的優雅、舒適與富足生活。", l: "極高自我價值與經濟獨立，單身生活精緻奢華不妥協。有伴侶者享受著高質量的生活與自由空間。", f: "環境優美舒適，物質條件極佳。家人享受高品質休閒生活，充滿自信、獨立且富足的完美狀態。" },
        { n: "錢幣十", i: "🪙", c: "事業達到最頂峰穩固狀態！代表大企業、家族事業或豐厚退休金。基業長青，帶來長遠安全感與財富。", l: "感情完全融入雙方家庭與現實生活。強烈暗示門當戶對的婚姻、深厚家族連結及物質層面的極度穩固。", f: "家族繁榮、世代傳承終極象徵。幾代同堂，家產豐厚，家庭觀念極重。享受家族龐大資源與無比安全感。" },
        { n: "錢幣侍者", i: "🪙", c: "務實勤奮學習者。有明確目標，願意腳踏實地從基礎做起。可能收到獎學金、新工作或小額收入好消息。", l: "踏實、謹慎且進展緩慢的戀情。對方不擅甜言蜜語，但真誠可靠，願意為雙方未來進行實際規劃努力。", f: "年輕成員表現懂事勤奮好學，或家庭開展一項務實的小投資與儲蓄計畫，穩步為家庭累積財富。" },
        { n: "錢幣騎士", i: "🪙", c: "極度穩健充滿責任感。雖然進展緩慢，但非常可靠會堅持到底完成任務。適合處理需高度耐性細心的工作。", l: "對方極具責任感、忠誠但稍顯木訥。承諾了就會做到，為你提供強大物質安全感，是非常適合結婚的關係。", f: "有一位默默付出、承擔家庭現實重擔的成員。家庭生活按部就班有規律，雖缺激情但極度安穩可靠。" },
        { n: "錢幣王后", i: "🪙", c: "擅長理財與資源管理。職場上極具耐心包容力，能為團隊提供實質支持穩定力量，適合金融或行政管理。", l: "扮演溫柔且具備現實能力的照顧者。這是一段溫暖、舒適且物質豐裕的關係，令人感到極度安心。", f: "充滿母愛、極懂持家的女性長輩。把家裡打理得井井有條，能為家人提供豐盛食物與實質的財富保障。" },
        { n: "錢幣國王", i: "🪙", c: "財富與世俗成就頂點！擁有極佳商業頭腦雄厚實力，穩重成功具權力的領導者，投資眼光精準。", l: "事業有成、經濟實力雄厚且極度穩重的人。能為這段關係提供最頂級的物質享受與現實保障，是強大依靠。", f: "父親或男性長輩是位事業成功的實業家。為整個家族提供最堅實經濟後盾與極高生活水準，深受敬重。" }
    ];

    let deckCopy = [];
    let currentStage = 0; // 0=事業, 1=感情, 2=生活
    let drawnCardData = null;

    window.onload = () => { initDeck(); };

    function initDeck() {
        document.getElementById('analysisContainer').style.display = 'none';
        const deckStack = document.getElementById('deckStack');
        deckStack.style.display = 'block';
        deckStack.style.pointerEvents = 'auto';
        document.getElementById('displayCard').classList.remove('show', 'shrink');
        
        currentStage = 0;
        deckCopy = [...tarotDeck];
        updateStageText();
    }

    function updateStageText() {
        const titleArr = ["💼 【第一張：事業學業】", "❤️ 【第二張：感情緣份】", "🏡 【第三張：家庭生活】"];
        const subArr = [
            "請點擊下方牌堆，抽取第一張【事業牌】",
            "請繼續點擊牌堆，抽取第二張【感情牌】",
            "最後一次點擊牌堆，抽取第三張【生活牌】"
        ];
        document.getElementById('subtitleText').innerHTML = "深呼吸，這是一場與宇宙的對話。<br>" + subArr[currentStage];
        document.getElementById('stageTitle').innerText = titleArr[currentStage];
    }

    function drawNextCard() {
        if(currentStage >= 3) return;

        // 隱藏牌堆
        const deckStack = document.getElementById('deckStack');
        deckStack.style.pointerEvents = 'none';
        deckStack.style.display = 'none';

        // 抽牌
        let randomIndex = Math.floor(Math.random() * deckCopy.length);
        drawnCardData = deckCopy.splice(randomIndex, 1)[0];

        // 填入顯示卡片
        document.getElementById('cardIcon').innerText = drawnCardData.i;
        document.getElementById('cardName').innerText = drawnCardData.n;

        // 翻開並放大特大卡牌
        const displayCard = document.getElementById('displayCard');
        displayCard.classList.remove('shrink');
        displayCard.classList.add('show');

        document.getElementById('subtitleText').innerHTML = "✨ 宇宙的指引已為你解開 ✨<br>請仔細感受這張牌的能量。";

        // 兩秒後，自動將大牌移去旁邊並顯示解析
        setTimeout(() => {
            displayCard.classList.remove('show');
            displayCard.classList.add('shrink');
            showAnalysis();
        }, 2000);
    }

    function showAnalysis() {
        document.getElementById('stageCardName').innerText = "🔮 " + drawnCardData.n;
        
        let desc = "";
        if(currentStage === 0) desc = drawnCardData.c;
        if(currentStage === 1) desc = drawnCardData.l;
        if(currentStage === 2) desc = drawnCardData.f;
        
        document.getElementById('stageDesc').innerText = desc;
        
        const analysisContainer = document.getElementById('analysisContainer');
        analysisContainer.style.display = 'flex';
        
        const nextBtn = document.getElementById('nextBtn');
        const resetBtn = document.getElementById('resetBtn');
        
        if(currentStage < 2) {
            nextBtn.style.display = 'block';
            resetBtn.style.display = 'none';
        } else {
            nextBtn.style.display = 'none';
            resetBtn.style.display = 'block';
        }
    }

    function prepareNextStage() {
        document.getElementById('analysisContainer').style.display = 'none';
        document.getElementById('displayCard').classList.remove('shrink');
        
        const deckStack = document.getElementById('deckStack');
        deckStack.style.display = 'block';
        
        setTimeout(() => {
            deckStack.style.pointerEvents = 'auto';
            currentStage++;
            updateStageText();
        }, 300);
    }

    function resetAll() {
        initDeck();
    }
</script>
