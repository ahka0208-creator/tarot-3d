<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌌 塔羅全方位運程 (78張深度詳解版)</title>
    <style>
        :root {
            --bg-dark: #07080a;
            --bg-light: #1a222c;
            --gold: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.4);
            --text-main: #c5c6c7;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at top center, var(--bg-light) 0%, var(--bg-dark) 100%);
            color: var(--text-main);
            margin: 0;
            padding: 20px 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        h2 {
            color: var(--gold);
            text-align: center;
            font-size: 24px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--gold-glow);
            margin-top: 5px;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #8a9ba8;
            margin-bottom: 20px;
            line-height: 1.5;
            height: 42px;
        }

        .spread-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 20px;
            z-index: 10;
        }

        .card-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .position-label {
            color: var(--gold);
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--gold);
            padding-bottom: 3px;
        }

        .scene {
            width: 100%;
            aspect-ratio: 2 / 3.2;
            perspective: 1000px;
            position: relative;
        }

        .empty-slot {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px dashed rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgba(212, 175, 55, 0.5);
            font-size: 12px;
            box-sizing: border-box;
            transition: opacity 0.3s;
        }

        .card {
            width: 100%;
            height: 100%;
            position: absolute;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            border-radius: 8px;
            display: none;
        }

        .pop-in {
            display: block;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .card.is-flipped {
            transform: translateY(-15px) rotateY(180deg) scale(1.08);
            box-shadow: 0 15px 30px var(--gold-glow);
            z-index: 20;
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid var(--gold);
            box-sizing: border-box;
        }

        .card-face-back {
            background: linear-gradient(135deg, #111 0%, #2b1b3d 100%);
            background-image: repeating-linear-gradient(45deg, rgba(212,175,55,0.05) 0, rgba(212,175,55,0.05) 2px, transparent 2px, transparent 6px);
        }

        .mystic-circle {
            width: 40px;
            height: 40px;
            border: 1px dashed var(--gold);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }

        /* 復古塔羅牌正面設計 */
        .card-face-front {
            background: linear-gradient(135deg, #eaddc5 0%, #d4c098 100%);
            box-shadow: inset 0 0 20px rgba(90, 60, 20, 0.6);
            transform: rotateY(180deg);
            padding: 6px;
            border: 1px solid #111;
        }

        .card-front-inner {
            width: 100%;
            height: 100%;
            border: 1px solid #5a4628;
            border-radius: 3px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 6px;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.15);
        }

        .card-image-frame {
            width: 100%;
            flex: 1;
            margin-bottom: 6px;
            border: 1px solid #8b6e41;
            background: radial-gradient(circle, #fdfbf7 0%, #eaddc5 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 2px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.15);
        }

        .card-image-placeholder { 
            font-size: 55px; 
            filter: drop-shadow(3px 5px 4px rgba(0,0,0,0.4)); 
        }

        .card-name {
            font-size: 11px; 
            font-family: "Georgia", "Times New Roman", serif;
            font-weight: bold; 
            color: #2b1b3d;
            text-align: center; 
            border-top: 1px solid #5a4628;
            border-bottom: 1px solid #5a4628; 
            padding: 4px 0; 
            width: 100%;
            letter-spacing: 1px;
            background: rgba(255,255,255,0.25);
        }

        /* 扇形牌堆區 */
        .deck-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 160px;
            margin-top: 10px;
            overflow: hidden;
            transition: opacity 0.8s, transform 0.8s;
        }

        .deck-container.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px);
        }

        .deck-card {
            position: absolute;
            bottom: -30px;
            left: 50%;
            width: 40px;
            height: 70px;
            background: linear-gradient(135deg, #111 0%, #2b1b3d 100%);
            border: 1px solid rgba(212,175,55,0.6);
            border-radius: 4px;
            transform-origin: bottom center;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.4s ease, margin-bottom 0.2s;
            box-shadow: -2px 0 5px rgba(0,0,0,0.5);
        }

        .deck-card:hover {
            margin-bottom: 15px;
            border-color: #fff;
            box-shadow: 0 0 10px var(--gold-glow);
            z-index: 100 !important;
        }

        .deck-card.drawn {
            opacity: 0;
            transform: translateY(-50px) scale(0.5) !important;
            pointer-events: none;
        }

        /* 深度分析區 */
        .analysis-container {
            width: 100%;
            max-width: 500px;
            display: none;
            flex-direction: column;
            animation: fadeIn 1s forwards;
            margin-top: 10px;
            margin-bottom: 30px;
        }

        .analysis-scroll-area {
            background: rgba(31, 40, 51, 0.85);
            border-left: 3px solid var(--gold);
            padding: 20px 15px;
            border-radius: 0 10px 10px 0;
            box-sizing: border-box;
            max-height: 45vh; 
            overflow-y: auto; 
        }

        .analysis-scroll-area::-webkit-scrollbar { width: 5px; }
        .analysis-scroll-area::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); border-radius: 10px; }
        .analysis-scroll-area::-webkit-scrollbar-thumb { background-color: var(--gold); border-radius: 10px; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .analysis-block { margin-bottom: 22px; }
        .analysis-block:last-child { margin-bottom: 0; }
        .block-title {
            color: var(--gold); font-size: 16px; font-weight: bold;
            margin-bottom: 8px; display: flex; align-items: center; gap: 5px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2); padding-bottom: 5px;
        }
        .block-card-name {
            font-size: 15px; font-weight: bold; color: #fff; margin-bottom: 8px;
            display: inline-block; background: rgba(212, 175, 55, 0.2);
            padding: 3px 10px; border-radius: 5px;
        }
        .block-desc { font-size: 15px; line-height: 1.7; color: #d1d5db; text-align: justify; }

        .action-btn {
            background: transparent;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 14px 30px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            margin-top: 15px; 
        }
        .action-btn:hover { background: var(--gold); color: #0b0c10; }

    </style>
</head>
<body>

    <h2>🌌 塔羅全方位運程</h2>
    <div class="subtitle" id="subtitleText">深呼吸，請從下方 78 張牌陣中<br>憑直覺抽出 <b>3</b> 張屬於你的牌。</div>

    <div class="spread-container" id="spreadContainer">
        <!-- 領域 1：事業 -->
        <div class="card-wrapper">
            <div class="position-label">💼 事業學業</div>
            <div class="scene">
                <div class="empty-slot" id="slot-0">抽取 1</div>
                <div class="card" id="card-0" onclick="flipCard(0)">
                    <div class="card-face card-face-back"><div class="mystic-circle">🔯</div></div>
                    <div class="card-face card-face-front">
                        <div class="card-front-inner">
                            <div class="card-image-frame">
                                <div class="card-image-placeholder" id="cardIcon-0"></div>
                            </div>
                            <div class="card-name" id="cardName-0"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- 領域 2：感情 -->
        <div class="card-wrapper">
            <div class="position-label">❤️ 感情緣份</div>
            <div class="scene">
                <div class="empty-slot" id="slot-1">抽取 2</div>
                <div class="card" id="card-1" onclick="flipCard(1)">
                    <div class="card-face card-face-back"><div class="mystic-circle">🔯</div></div>
                    <div class="card-face card-face-front">
                        <div class="card-front-inner">
                            <div class="card-image-frame">
                                <div class="card-image-placeholder" id="cardIcon-1"></div>
                            </div>
                            <div class="card-name" id="cardName-1"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- 領域 3：生活 -->
        <div class="card-wrapper">
            <div class="position-label">🏡 家庭生活</div>
            <div class="scene">
                <div class="empty-slot" id="slot-2">抽取 3</div>
                <div class="card" id="card-2" onclick="flipCard(2)">
                    <div class="card-face card-face-back"><div class="mystic-circle">🔯</div></div>
                    <div class="card-face card-face-front">
                        <div class="card-front-inner">
                            <div class="card-image-frame">
                                <div class="card-image-placeholder" id="cardIcon-2"></div>
                            </div>
                            <div class="card-name" id="cardName-2"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 真實 78 張扇形牌堆 -->
    <div class="deck-container" id="deckContainer"></div>

    <!-- 外層分析區 -->
    <div class="analysis-container" id="analysisContainer">
        <div class="analysis-scroll-area">
            <div class="analysis-block">
                <div class="block-title">💼 【事業與學業發展】</div>
                <div class="block-card-name" id="namePast"></div>
                <div class="block-desc" id="descPast"></div>
            </div>
            <div class="analysis-block">
                <div class="block-title">❤️ 【感情與人際緣份】</div>
                <div class="block-card-name" id="namePresent"></div>
                <div class="block-desc" id="descPresent"></div>
            </div>
            <div class="analysis-block">
                <div class="block-title">🏡 【家庭與整體生活】</div>
                <div class="block-card-name" id="nameFuture"></div>
                <div class="block-desc" id="descFuture"></div>
            </div>
        </div>
        <button class="action-btn" onclick="resetAll()">🔄 重新洗牌測算</button>
    </div>

<script>

        { n: "II. 女祭司", i: "🌙",

        { n: "XI. 正義", i: "⚖️", 
          c: "一切講求理智、規則與公平。付出多少就會收穫多少。非常適合處理合約、法律事務、協商談判，或進行公正的績效評估與重大決策。", 
          l: "感情需要建立在對等、誠實與互相尊重的基礎上。如果關係失去平衡（如單方面付出），現在是攤牌講清楚的時候；處理感情問題需保持客觀。", 
          f: "家庭中需要秉公處理事務，不偏袒任何一方。如果有財務分配、遺產問題或責任上的分工，現在是白紙黑字釐清、講求公平的最佳時機。" },
        { n: "XII. 倒吊人", i: "🦇", 
          c: "事業發展目前處於停滯期，你可能覺得付出與回報不成正比。代表你需要按下暫停鍵，換一個完全不同的角度去看待問題，或者暫時作出一些妥協。", 
          l: "感情似乎陷入了僵局，或者你正在單方面無條件付出。不要急於打破現狀，給彼此一點喘息的空間，重新審視這段關係的真正意義，你會得到頓悟。", 
          f: "你可能需要為家庭作出一些自我犧牲、讓步或改變原有計畫。面對家人的不理解，嘗試用截然不同的角度去思考他們的出發點，放下執著才是出路。" },
        { n: "XIII. 死神", i: "💀", 
          c: "某個階段即將徹底結束（如辭職、項目終止、公司重組）。不要害怕，舊的不去新的不來，這是為了迎接更好發展的必要「大掃除」，勇敢放手。", 
          l: "感情面臨深刻且無法逆轉的轉變。不健康的關係將會走向終結，或者雙方必須徹底改變舊有的相處模式，才能讓關係浴火重生。", 
          f: "家庭的舊有模式已經不再適用。必須勇敢放下過去的糾葛、歷史包袱或有毒的親情勒索，迎接家庭結構或生活方式的重大翻新與重生。" },
        { n: "XIV. 節制", i: "🕊️", 
          c: "溝通與協調能力極佳！非常適合處理跨部門合作、資源整合或化解職場衝突。請保持工作與生活的平衡，凡事不宜走極端，尋求中庸之道。", 
          l: "感情發展細水長流，雙方正在進行良好的磨合與溝通。彼此能夠互相體諒，尋找到最舒服的相處節奏，關係達到完美且和諧的動態平衡。", 
          f: "家庭氣氛溫和融洽。之前如果有摩擦或誤會，現在是最佳的調解時機，大家都能理性溝通、各退一步，達到完美的和睦狀態。" },
        { n: "XV. 惡魔", i: "⛓️", 
          c: "你可能因為過度追求金錢、權力而陷入高壓，甚至面臨職場上的不道德誘惑或辦公室政治。小心被工作綁架，失去了生活與選擇的自由。", 
          l: "充滿強烈的肉體吸引力，但可能是一段不健康的「孽緣」。注意控制欲過強、互相猜忌，或者僅僅建立在物質利益與情慾上的依賴關係。", 
          f: "家庭可能會因為金錢利益分配、遺產糾紛，或某些不良習慣（如沉迷賭博、過度消費、情緒勒索）而產生嚴重糾紛。需要及時斬斷惡性循環。" },
        { n: "XVI. 高塔", i: "⚡", 
          c: "小心突如其來的巨大衝擊！可能是公司無預警裁員、計畫被迫中斷或犯下大錯。雖然令人震驚痛苦，但這同時也摧毀了限制你的錯誤基礎。", 
          l: "可能會有突發的激烈爭吵，或者隱藏已久的秘密（如背叛、謊言）突然曝光。這是一個打破虛假和平的時刻，必須勇敢直面最真實、最殘酷的問題。", 
          f: "家中可能發生意料之外的突發事件或激烈衝突。雖然一時之間會感到極度混亂與崩潰，但這是一次大破大立的契機，逼迫大家面對並解決現實。" },
        { n: "XVII. 星星", i: "🌟", 
          c: "前景光明，充滿希望。這段時期特別利於從事藝術、創意、科技或療癒相關的工作。你之前的努力終於看到了曙光，請跟隨內心願景前進。", 
          l: "感情關係和諧美好，充滿了心靈上的高度契合。單身者對愛情抱持美好的憧憬，易吸引靈魂伴侶；有伴侶者之間的誤會將被治癒，步入平靜期。", 
          f: "家庭氛圍如星空般寧靜祥和。之前的隔閡或爭吵將會得到完美的療癒與釋懷。這是一個適合全家人聚在一起，互相傾訴心聲、修復關係的好時刻。" },
        { n: "XVIII. 月亮", i: "🌕", 
          c: "職場局勢不明朗，可能存在隱藏的風險、潛規則或背後的小人。這段時間絕對不宜做重大決定，事情並不如表面所見，需小心謹慎觀察。", 
          l: "感情中充滿了不安、猜忌與恐懼。你可能因為過度敏感而產生幻覺，或者對方有些事情沒有坦白。請冷靜留意自己的情緒起伏，不要妄下定論。", 
          f: "家中可能有一些不願意公開的秘密、財務隱憂或難以啟齒的問題。家人之間可能缺乏安全感，容易因為誤會而產生情緒化的過激反應。" },
        { n: "XIX. 太陽", i: "☀️", 
          c: "大吉大利！你的工作將獲得極大的成功與認可。專案順利落地、有機會升職加薪，你的才華和努力都會被看見。保持你的熱情與活力向前衝！", 
          l: "熱情如火，關係完全明朗化。這是一個充滿喜悅的時刻，非常適合公開戀情、見家長、結婚甚至孕育新生命。沒有隱瞞，只有純粹的愛與快樂。", 
          f: "家中充滿了歡聲笑語，陽光普照。近期可能有喜事臨門（如添丁、金榜題名），家庭關係極其融洽。這股正能量會感染所有人，是享受天倫的大好時光。" },
        { n: "XX. 審判", i: "🎺", 
          c: "這是一個總結與評估的關鍵時刻。過去的努力即將得到最終的評判；如果你之前經歷過失敗或低潮，現在是重整旗鼓、東山再起的大好時機。", 
          l: "關係面臨關鍵的十字路口。可能是破鏡重圓、解開多年的心結，或者是徹底放下過去不適合的人，迎來感情觀念上的自我覺醒與解脫。", 
          f: "家庭中過去遺留的歷史問題或恩怨即將得到最終解決。這是一個互相原諒、放下執念，讓家庭關係重獲新生、迎來大團圓的覺醒時刻。" },
        { n: "XXI. 世界", i: "🌍", 
          c: "完美達標！你負責的項目將圓滿結束，獲得極高的讚譽與實質回報。這是一個階段性的完美終點，你已經準備好迎接下一個更高層次的挑戰與旅程。", 
          l: "感情開花結果，達到最和諧完美的狀態。這張牌強烈暗示著婚姻的承諾、修成正果，或者雙方找到了最適合彼此、無可挑剔的生活方式。", 
          f: "家庭生活幸福圓滿。一切都處於最佳狀態，家人之間充滿包容與滿滿的愛，居住環境舒適，你對目前的家庭狀況感到無比的安全、富足與感恩。" },

        // 權杖 (事業、行動、熱情)
        { n: "權杖一", i: "🔥", 
          c: "靈感爆發！這是一個開啟新計畫、創業或轉行的大好時機，充滿了無限的潛力與熱情，大膽去執行你的點子吧。", 
          l: "感情迎來熱情的火花。單身者極易一見鍾情或展開熱烈追求；有伴侶者能找回熱戀時的衝動與激情，關係充滿新鮮感。", 
          f: "家庭充滿生機，可能有新成員加入、搬家或裝修等新氣象，大家對未來的家庭生活充滿熱情的期盼與動力。" },
        { n: "權杖二", i: "🔥", 
          c: "你已經擁有了一定的基礎與主導權，現在面臨兩難的選擇或海外發展的機會。勇敢放眼更長遠的目標，不要局限於眼前的安逸。", 
          l: "面對感情的抉擇。可能在兩個對象之間猶豫，或者考慮這段關係的長遠未來（例如是否要異地戀或共同出國發展）。", 
          f: "可能正在規劃家庭的長遠未來，例如子女的海外升學計畫、移民或跨城市搬遷。你需要宏觀地權衡利弊。" },
        { n: "權杖三", i: "🔥", 
          c: "先前的努力開始見效，準備迎接更廣闊的發展空間與合作機會。非常有利於拓展海外市場、貿易或進行跨界合作。", 
          l: "感情發展順利且充滿希望。雙方對未來有著共同的藍圖與共識，這是一段能共同成長、眼界開闊的健康關係。", 
          f: "家庭生活步入穩定期，且有向外擴展的跡象。可能是家族事業發展順利，或者家人在海外傳來令人振奮的好消息。" },
        { n: "權杖四", i: "🔥", 
          c: "達成了一個重要的里程碑！可能是試用期通過、專案順利完工。這是一個值得慶祝的時刻，你已經建立了穩固的基礎。", 
          l: "關係非常穩定且充滿歡樂。這是一張代表同居、訂婚或舉行婚禮的經典牌，雙方在親友的祝福下邁向新階段。", 
          f: "家庭和睦，充滿節慶氣氛。近期非常適合舉辦家族聚會、入伙派對或慶祝活動，家庭能為你提供強大的避風港。" },
        { n: "權杖五", i: "🔥", 
          c: "職場上充滿競爭、混亂與意見分歧。每個人都想爭取主導權。你需要透過積極的溝通與良性競爭來突破當前的困境。", 
          l: "雙方容易因為一些小事或面子問題而發生口角與爭執。這通常不是致命的危機，但需要放下自尊，尋求和解的空間。", 
          f: "家中可能因為意見不合而顯得吵鬧，大家各有各的道理，難以妥協。需要一個客觀的人出來主持大局，平息紛爭。" },
        { n: "權杖六", i: "🔥", 
          c: "勝利與榮耀！你的努力獲得了外界的認可，可能受到表揚、升職或帶領團隊取得佳績。這是一個充滿自信與好消息的時刻。", 
          l: "在感情的競爭中脫穎而出，成功贏得對方的芳心。有伴侶者會因為另一半的成就而感到驕傲，雙方關係備受外界祝福。", 
          f: "家人為你的成就感到自豪。家中可能有人金榜題名、升職加薪或獲得榮譽，為整個家庭帶來了榮光與歡樂的氣氛。" },
        { n: "權杖七", i: "🔥", 
          c: "面臨激烈的挑戰與反對聲音，你處於一個需要捍衛自己立場的關鍵位置。請保持自信與優勢，你有足夠的能力抵禦外界壓力。", 
          l: "這段關係可能不被外界看好，或者面臨情敵的競爭。你需要堅定自己的心意，勇敢捍衛這段感情，不要輕言放棄。", 
          f: "在家庭決策中，你可能需要獨排眾議，堅持自己認為對的方向。雖然會受到家人的質疑，但請用實力證明你的選擇。" },
        { n: "權杖八", i: "🔥", 
          c: "事情進展極快，延誤的障礙已經消除！可能是突然收到重要郵件、快速出差或專案加速推進。是乘勝追擊的好時機。", 
          l: "感情發展突飛猛進，可能是閃電戀愛、迅速同居或熱烈的網戀。溝通非常頻繁且順暢，充滿了激情的火花。", 
          f: "家中可能突然有很多事情需要同時處理，或者有突如其來的探訪。雖然節奏很快，但一切都在朝著積極的方向發展。" },
        { n: "權杖九", i: "🔥", 
          c: "你已經感到疲憊不堪，甚至滿身傷痕，但距離成功只差最後一步。請保持警覺，咬緊牙關撐下去，不要在最後關頭放棄。", 
          l: "在感情中受過傷，導致你現在築起心牆，對這段關係或新對象充滿戒心與防備。需要時間去重建信任與安全感。", 
          f: "為了家庭的重擔，你已經苦撐了很久。雖然感到心力交瘁，但你的堅持保護了這個家，請繼續堅守最後的防線。" },
        { n: "權杖十", i: "🔥", 
          c: "你承擔了過多不屬於你的責任，被工作壓得喘不過氣，甚至影響了健康。你需要學會授權、放下或勇敢對不合理的要求說「不」。", 
          l: "這段感情讓你感到沉重無比，責任大於快樂。你可能單方面承擔了所有的壓力，需要與伴侶坦誠溝通，尋求共同分擔。", 
          f: "你是家庭的「頂心杉」，所有的家計與瑣事都壓在你的肩上。不要自己一個人硬撐，適當地向家人示弱並尋求幫助。" },
        { n: "權杖侍者", i: "🔥", 
          c: "可能收到關於新工作或新項目的好消息。帶著初生之犢不畏虎的精神去探索新領域吧，保持你的好奇心與學習熱忱。", 
          l: "充滿熱情與新鮮感的戀愛萌芽。可能會遇到一個充滿活力、單純且喜歡冒險的對象，或者現有關係注入了活潑的元素。", 
          f: "家中有年輕成員帶來了充滿活力的好消息，或者家庭將開展一個令人興奮的新計畫（如學習新技能、短途旅行）。" },
        { n: "權杖騎士", i: "🔥", 
          c: "充滿幹勁，行動迅速！非常適合開拓新市場或執行短期任務。但需注意不要因為過於急躁或衝動而忽略了重要細節。", 
          l: "一段熱烈但可能短暫的戀情。對方熱情如火、主動出擊，但可能缺乏長遠的承諾與耐性，來得快去得也快。", 
          f: "家中可能面臨突發的改變或搬遷，行動力極高。家人之間可能因為一時衝動而有小摩擦，但很快就會和好如初。" },
        { n: "權杖王后", i: "🔥", 
          c: "以積極、樂觀且充滿魅力的態度處理工作。你極佳的人際手腕與溫暖的性格，能輕易感染並帶動整個團隊的士氣。", 
          l: "你（或你的伴侶）在關係中展現出自信、獨立且熱情的特質。這是一段成熟且充滿活力的關係，雙方都能給予彼此極大的支持。", 
          f: "家中有位溫暖、開朗且能幹的女性長輩在維持著家庭的和諧。家庭氣氛充滿歡樂與正能量，令人感到賓至如歸。" },
        { n: "權杖國王", i: "🔥", 
          c: "展現出果斷的領導力與魄力。這是一張代表創業者或高階主管的牌，以宏觀的視野與堅定的意志去掌控全局，達成目標。", 
          l: "關係中有一方處於主導地位，熱情、慷慨但可能有點大男人/大女人主義。雙方關係坦誠直接，不喜歡拐彎抹角。", 
          f: "父親或家中的權威人士將作出果斷的決定。他用強大的能力與資源保護著這個家，雖然嚴格但出發點充滿了熱忱。" },

        // 聖杯 (情感、關係、直覺)
        { n: "聖杯一", i: "🍷", 
          c: "一個讓你充滿熱情與靈感的新項目即將開始。工作氛圍非常和諧，你對目前的工作內容感到發自內心的喜愛與滿足。", 
          l: "情感的滿溢！這代表著深刻的新戀情萌芽，或者現有關係迎來了全新的心靈契合，心靈感到無比的幸福與平靜。", 
          f: "家庭中充滿了愛與包容的能量。可能有新生命的降臨、領養寵物，或者家人之間解開了心結，達成了深層的情感連結。" },
        { n: "聖杯二", i: "🍷", 
          c: "極佳的合作夥伴關係。雙方地位平等、互相尊重且優勢互補。非常利於簽署合約、合夥創業或進行一對一的客戶洽談。", 
          l: "平等的結合與完美的契合。這是一段充滿愛、互相理解且極具吸引力的浪漫關係，雙方眼裡只有彼此，非常甜蜜。", 
          f: "家人之間（特別是夫妻或兄弟姊妹）關係非常融洽和睦，能夠互相傾聽與支持，家庭中的決策都能得到一致的同意。" },
        { n: "聖杯三", i: "🍷", 
          c: "團隊合作無間，工作氣氛輕鬆愉快。專案成功後，非常適合與同事們一起舉辦慶功宴，分享勝利的喜悅與成果。", 
          l: "感情生活多姿多采，可能透過朋友聚會認識新對象。但也需注意，這張牌有時暗示著關係中牽涉到第三方（如朋友干涉或三角關係）。", 
          f: "歡聚與慶祝的時刻！家中有喜事發生（如婚禮、畢業、生日派對），親朋好友相聚一堂，充滿了歡樂與和諧的社交氛圍。" },
        { n: "聖杯四", i: "🍷", 
          c: "對目前的工作感到枯燥乏味或缺乏動力。你可能陷入了職業倦怠，甚至忽略了身邊正在為你提供的新機會或貴人。", 
          l: "對感情現狀感到不滿或無聊，進入了冷淡期。你可能將自己封閉起來，不願意接受對方的示好，或者對新戀情提不起勁。", 
          f: "家庭生活顯得一成不變，讓你感到沉悶。你可能對家人的關心感到麻木，需要自己靜一靜，重新尋找生活的熱情與意義。" },
        { n: "聖杯五", i: "🍷", 
          c: "項目失敗或錯失良機，讓你感到強烈的失落與懊悔。但請不要一直盯著失去的部分，轉頭看看，你還保留著翻盤的實力與資源。", 
          l: "經歷了分手、背叛或深深的失望。你沉浸在過去的悲傷中無法自拔。請明白這段關係並非你的全部，仍有愛你的人在身邊。", 
          f: "家庭中可能經歷了某些損失或令人傷心的變故。雖然充滿遺憾，但家人之間的情感紐帶並未完全斷裂，請珍惜眼前人。" },
        { n: "聖杯六", i: "🍷", 
          c: "過去的經驗或舊同事將為你帶來幫助。工作環境充滿了人情味，或者你正在從事與歷史、懷舊、兒童相關的行業。", 
          l: "回憶與純真的愛。可能會與舊情人重逢，或者與青梅竹馬發展戀情。這段關係充滿了照顧、安全感與過往的美好回憶。", 
          f: "家庭中充滿了懷舊與溫馨的氣氛。非常適合回鄉探親、翻閱舊相簿，或者長輩對晚輩展現出無微不至的關懷與照顧。" },
        { n: "聖杯七", i: "🍷", 
          c: "面前有很多誘人的機會或發展方向，但很多只是虛幻的畫大餅。你需要保持清醒的頭腦，評估風險，做出最實際的選擇。", 
          l: "在多個曖昧對象中猶豫不決，或者對感情抱有過於不切實際的浪漫幻想。看清對方的真面目，不要愛上自己幻想出來的人。", 
          f: "對於家庭的未來有太多不切實際的計畫（如超出預算的買房或投資）。需要家人一起坐下來，務實地討論可行性，避免好高騖遠。" },
        { n: "聖杯八", i: "🍷", 
          c: "目前的工作雖然穩定，但已經無法滿足你內心的成就感。你決定放棄現有的一切，勇敢轉行或離職，去追尋更高層次的目標。", 
          l: "覺得現狀無法滿足心靈的契合，即使看似平靜，你仍決定轉身離開這段已經沒有靈魂的關係，去尋找更深層的意義。", 
          f: "可能因為理念不合或尋求獨立，決定搬離原生家庭。這是一個為了追尋自我成長而主動遠離熟悉環境的過程。" },
        { n: "聖杯九", i: "🍷", 
          c: "事業上的心願達成！你對目前的成就感到極度自豪與滿意。這是一張代表「美夢成真」的好牌，享受你應得的豐碩成果吧。", 
          l: "感情生活達到了你夢寐以求的狀態，物質與情感都得到極大的滿足。單身者非常享受目前的單身貴族生活，不急於脫單。", 
          f: "家庭生活極度舒適與奢華，物質條件豐裕。家人之間充滿了歡樂與滿足感，這是一個令人稱羨的幸福家庭狀態。" },
        { n: "聖杯十", i: "🍷", 
          c: "在一個極具向心力且像大家庭般的團隊中工作，同事之間互相扶持。這份工作為你帶來了極大的長遠安全感與心靈滿足。", 
          l: "美滿與和諧的終極象徵！關係達到了最幸福的狀態，充滿著愛、安全感與長遠的承諾，非常適合步入婚姻或共組家庭。", 
          f: "家庭關係最完美的寫照。家中充滿了愛與和睦，幾代同堂其樂融融，家庭為你提供了最強大的心靈避風港與無條件的支持。" },
        { n: "聖杯侍者", i: "🍷", 
          c: "直覺敏銳且充滿想像力。可能收到關於合作、藝術創作或人際交流的好消息。這份工作需要你運用感性與創意去處理。", 
          l: "一段溫柔浪漫的新戀情正在萌芽。對方可能較為年輕或充滿藝術氣息。這是一個真誠、單純且需要小心呵護的情感開端。", 
          f: "家中可能有關於懷孕、新生兒降臨，或者年輕成員帶來了令人欣慰的好消息。家庭氣氛變得柔和且充滿感情。" },
        { n: "聖杯騎士", i: "🍷", 
          c: "充滿詩意與感性。你將收到一個友善的提案或邀請。適合從事外交、公關或藝術相關工作，用你的魅力去說服他人。", 
          l: "白馬王子般的浪漫追求！對方極具魅力、深情且懂得製造驚喜。但需注意對方可能過於理想化，在現實層面稍顯不足。", 
          f: "家庭中將出現一個擔任調解員角色的人，用溫柔與同理心化解家人的矛盾。近期可能有愉快的家庭聚會或浪漫的家庭旅行。" },
        { n: "聖杯王后", i: "🍷", 
          c: "運用極強的直覺與同理心來處理工作事務。你善解人意，非常適合從事輔導、人力資源或任何需要情感交流的服務業。", 
          l: "你（或伴侶）在關係中展現出無限的溫柔、包容與情感支持。這是一段心靈高度契合的關係，能互相療癒彼此的創傷。", 
          f: "家中有位充滿母性光輝、極具同理心的女性長輩。她是家庭的情感支柱，總是能敏銳地察覺家人的需要並給予無私的愛。" },
        { n: "聖杯國王", i: "🍷", 
          c: "能完美平衡理智與情感的領導者。你在職場上圓融世故，是個寬容且充滿智慧的傾聽者，能輕易化解人事糾紛並贏得人心。", 
          l: "對方是一個成熟、深情且情緒極度穩定的人。他不會輕易表露強烈的情緒，但會用極具包容力與智慧的方式來維護這段感情。", 
          f: "家中的父親或長輩扮演著穩定軍心的角色。他充滿智慧、情緒穩定，能以溫和但具威嚴的方式，為家庭提供強大的心靈庇護。" },

        // 寶劍 (理智、衝突、傷害)
        { n: "寶劍一", i: "⚔️", 
          c: "清晰的思考與決斷力。用理智斬斷迷霧，看清真相。這是一個極佳的突破口，新的思維或計畫將為你帶來巨大的優勢。", 
          l: "感情中需要絕對的坦誠與理智溝通。不適合感性用事，可能需要做出一個冷靜且無情的決定，斬斷不合適的關係。", 
          f: "面對家庭問題，必須拋開情緒勒索，用最客觀、理性的方式去解決。現在是把話說清楚，定立清晰家庭規則的時刻。" },
        { n: "寶劍二", i: "⚔️", 
          c: "職場上陷入僵局，各方勢力互相牽制。你可能自我蒙蔽不願面對現實，卡在兩難的選擇中，必須鼓起勇氣做出艱難的決定。", 
          l: "感情處於冷戰或停滯狀態。雙方都不願意妥協或面對核心問題。這種逃避無法解決危機，必須拿下眼罩，坦誠相對。", 
          f: "家庭中存在著一種「粉飾太平」的氣氛。大家為了避免衝突而選擇沉默，但問題依然存在，需要有人勇敢打破這個僵局。" },
        { n: "寶劍三", i: "⚔️", 
          c: "職場上可能會面臨嚴厲的批評、背叛或計畫受挫，言語上的中傷讓你感到痛苦。請保持冷靜，從錯誤中汲取教訓，不要被情緒擊垮。", 
          l: "感情正面臨令人心碎的時刻，可能出現第三者、嚴重爭吵甚至分離。雖然痛苦，但直面殘酷的真相是療癒與成長的必經之路。", 
          f: "家庭中可能有激烈的言語衝突或令人傷心的消息，氣氛較為低迷。請避免在情緒激動時互相傷害，給予彼此空間去平復心情。" },
        { n: "寶劍四", i: "⚔️", 
          c: "經歷了長期的工作壓力與高強度戰鬥後，你已經筋疲力盡。現在需要強制自己暫停一切，請假休息，讓身心恢復能量後再出發。", 
          l: "感情需要進入一段「冷靜期」。雙方都累了，暫時的隔離或退卻不是放棄，而是為了讓彼此有時間沉澱與思考未來的路。", 
          f: "家庭中經歷了風波後，現在進入了休養生息的階段。保持家中的安靜與平和，不要在此刻挑起任何新的話題或爭端。" },
        { n: "寶劍五", i: "⚔️", 
          c: "充滿敵意與自私的職場環境。你可能贏了一場無意義的爭論，卻失去了人心與合作機會。注意辦公室政治與惡意中傷。", 
          l: "關係中充斥著為了贏而贏的無意義爭執。雖然你在口舌上佔了上風，但卻深深傷害了對方的感情。放下自尊，避免兩敗俱傷。", 
          f: "家庭中爆發了嚴重的衝突，大家都在互相推卸責任或爭奪利益。這種爭吵沒有真正的贏家，只會讓整個家庭分崩離析。" },
        { n: "寶劍六", i: "⚔️", 
          c: "雖然帶著過往的創傷，但最壞的情況已經過去。你正在逐漸駛向平靜的水域，可能會有職務調動、出差或緩慢但穩定的復甦。", 
          l: "感情度過了最艱難的危機，雙方帶著傷痕決定共同走向未來。這是一段互相扶持、慢慢療癒彼此並遠離紛爭的過程。", 
          f: "家庭正在從巨大的悲傷或變故中慢慢恢復過來。可能需要搬離傷心地，或者全家共同進行一趟平靜的旅行來治癒心靈。" },
        { n: "寶劍七", i: "⚔️", 
          c: "職場上有人試圖用取巧、走捷徑或欺瞞的方式解決問題，甚至竊取你的成果。你需要保持警覺，自己也切忌因貪圖方便而犯錯。", 
          l: "這段感情充滿了不誠實與逃避。可能有一方正在說謊、隱瞞真相（如劈腿），或者總是用狡猾的方式逃避承諾與責任。", 
          f: "家庭中有人對財務或某些私事有所隱瞞，導致信任危機。面對家庭責任，不能只顧自己輕鬆而推卸給其他人。" },
        { n: "寶劍八", i: "⚔️", 
          c: "覺得在工作中被困住，無路可退。但其實綁住你的只是你內心的恐懼與過度思慮，只要你願意轉換心態，隨時都能掙脫束縛。", 
          l: "在感情中感到強烈的窒息感與不自由，覺得自己是受害者。但實際上是你自己畫地為牢，不願意正視離開或改變的可能性。", 
          f: "家庭規矩或長輩的期望像無形的繩索將你綑綁。你感到無力反抗，但只要你勇敢表達真實的想法，就會發現束縛並不存在。" },
        { n: "寶劍九", i: "⚔️", 
          c: "工作壓力大到讓你失眠與極度焦慮。被過度的擔憂與噩夢折磨，但這多半是你自己幻想出來的恐懼，並非現實中最壞的情況。", 
          l: "感情讓你備受折磨，內心充滿了恐懼、猜忌與不安全感。你可能在深夜裡反覆煎熬，需要停止內耗，尋求外界的幫助與開導。", 
          f: "因為擔心家人的健康或家庭財務狀況而憂心忡忡。這種焦慮已經嚴重影響了你的生活品質，請與家人坦白，不要獨自承受。" },
        { n: "寶劍十", i: "⚔️", 
          c: "事業遭遇徹底的結束與谷底，可能是被解雇或公司倒閉。情況壞到了極點，但也代表痛苦即將終結，重生的黎明就在不遠處。", 
          l: "這是一段帶來巨大痛苦並最終慘烈結束的關係。已經沒有挽回的餘地，接受這個殘酷的結局，是你邁向新生的唯一方法。", 
          f: "家庭經歷了毀滅性的打擊或痛苦的分裂。一切已經跌至谷底，不可能再壞了。收拾殘局，讓時間慢慢撫平一切創傷。" },
        { n: "寶劍侍者", i: "⚔️", 
          c: "思想敏捷，善於收集資訊與數據分析。你可能會收到重要的合約或法律文件。行事機警，但需注意溝通時不要過於尖銳。", 
          l: "對方是一個聰明機智但防備心重的人。這段關係充滿了言語上的交鋒與互相試探，缺乏感性的交流，需要小心溝通以免傷人。", 
          f: "家中有年輕成員可能過於叛逆或言辭犀利。家庭需要理性的溝通，留意是否有未經證實的流言蜚語在親戚間傳播。" },
        { n: "寶劍騎士", i: "⚔️", 
          c: "勇往直前、行動果斷且思維敏捷！非常適合處理突發危機或推行改革。但需避免魯莽行事及欠缺耐性，以免得罪同事。", 
          l: "感情發展迅速，對方腦筋轉得極快，但可能缺乏同理心與浪漫。雙方容易因為一時衝動而發生激烈的爭吵，來得快去得也快。", 
          f: "家庭中可能有突發的變故需要迅速處理。某個家人可能以強勢、急躁的態度介入家庭事務，帶來了混亂但也解決了問題。" },
        { n: "寶劍王后", i: "⚔️", 
          c: "理智、冷靜與獨立。不被情感左右，用客觀且銳利的眼光看透事物的本質。非常適合從事法律、審計或需要極高邏輯的工作。", 
          l: "你（或伴侶）在關係中表現得極為冷靜甚至冷酷。要求絕對的誠實與空間，不喜歡黏膩的關係，會果斷斬斷不適合的緣分。", 
          f: "家中有一位嚴厲、講求邏輯與原則的女性長輩。她雖然言語犀利不留情面，但能為家庭提供最客觀、正確的建議與指引。" },
        { n: "寶劍國王", i: "⚔️", 
          c: "權威、嚴謹與極強的邏輯判斷力。以公平嚴格的態度掌控大局，是個極具專業知識的領導者。工作上必須遵守嚴格的規範。", 
          l: "對方是一個極其理性、講求原則且不擅長表達情感的人。關係建立在互相尊重與智力匹配上，不要試圖用情緒去勒索他。", 
          f: "家庭中有一位具備絕對權威的長輩。他以嚴格的家規與高標準來要求家人，家庭事務需要透過理智與邏輯來進行討論。" },

        // 錢幣 (物質、現實、穩定)
        { n: "錢幣一", i: "🪙", 
          c: "極佳的物質與財務新機遇！可能是獲利豐厚的新工作、加薪或創業資金到位。一個務實的開端，穩紮穩打將為未來帶來豐碩成果。", 
          l: "一段建立在穩固現實基礎上的新戀情。雙方不僅有情感交流，更在金錢觀念與生活目標上高度契合，是一段能長遠發展的關係。", 
          f: "家庭財務狀況迎來新的轉機，可能有買房、獲得遺產或家庭收入增加的好消息。家庭生活物質條件得到實質的提升。" },
        { n: "錢幣二", i: "🪙", 
          c: "正在多項任務或財務狀況中玩拋接球。你需要極高的靈活度與時間管理能力來維持動態平衡。可能有兼職或資金周轉的需求。", 
          l: "在兩個對象之間游移不定，或者在愛情與麵包（事業）之間努力尋求平衡。關係充滿了起伏與變化，需要更多的適應力。", 
          f: "家庭財務可能面臨需要靈活調度的狀況。家人需要兼顧工作與家庭生活，在忙碌中努力維持著日常運作的平衡。" },
        { n: "錢幣三", i: "🪙", 
          c: "團隊合作的最佳典範！透過不同專業技能的結合與良好溝通，共同打造出高質量的成果。非常有利於建築、設計或專案開發。", 
          l: "這是一段猶如「合夥人」般的感情。雙方分工明確，為著共同的未來目標努力打拼。關係在互相學習與建設中變得更加穩固。", 
          f: "家庭成員齊心協力完成一項大工程（如房屋裝修、籌辦婚禮）。大家發揮各自的專長，溝通順暢，家庭凝聚力極強。" },
        { n: "錢幣四", i: "🪙", 
          c: "保守與固執。為了安全感而緊抓著現有資源不放，不願意冒險投資或分享權力。過度封閉與守舊會阻礙新機會的流入。", 
          l: "在感情中佔有慾極強，或者過於計較金錢與付出。不願意向對方敞開心扉，防備心重，這種窒息的愛會讓關係難以成長。", 
          f: "家庭對金錢極度保守，可能顯得有些吝嗇。家人之間過度保護既有財產，缺乏情感上的交流與慷慨，氣氛顯得死氣沉沉。" },
        { n: "錢幣五", i: "🪙",

        { n: "錢幣國王", i: "🪙",

          l: "對方是一個事業有成、經濟實力雄厚且極度穩重的人。他能為這段關係提供最頂級的物質享受與現實保障，是強而有力的依靠。", 
          f: "家中的父親或男性長輩是一位事業成功的實業家。他為整個家族提供了最堅實的經濟後盾與極高的生活水準，深受家人敬重。" }

    let deckCopy = [];
    let selectedCardsData = [];
    let flippedCount = 0;

    window.onload = function() {
        initDeck();
    };

    function initDeck() {
        const deckContainer = document.getElementById('deckContainer');
        deckContainer.innerHTML = '';
        deckContainer.classList.remove('hidden');
        deckCopy = [...tarotDeck];
        selectedCardsData = [];
        flippedCount = 0;

        document.getElementById('subtitleText').innerHTML = "深呼吸，請從下方 78 張牌陣中<br>憑直覺抽出 <b>3</b> 張屬於你的牌。";

        for (let i = 0; i < 78; i++) {
            let card = document.createElement('div');
            card.className = 'deck-card';
            card.style.zIndex = i;
            let angle = -65 + (i * (130 / 77));
            card.style.transform = `translateX(-50%) rotate(${angle}deg) translateY(-10px)`;
            card.onclick = function() { drawCardFromDeck(card); };
            deckContainer.appendChild(card);
        }
    }

    function drawCardFromDeck(cardElement) {
        if (selectedCardsData.length >= 3) return; 

        cardElement.classList.add('drawn');

        let randomIndex = Math.floor(Math.random() * deckCopy.length);
        let drawnCard = deckCopy.splice(randomIndex, 1)[0];
        selectedCardsData.push(drawnCard);

        let slotIndex = selectedCardsData.length - 1;

        document.getElementById(`slot-${slotIndex}`).style.opacity = '0';
        let displayCard = document.getElementById(`card-${slotIndex}`);
        
        document.getElementById(`cardIcon-${slotIndex}`).innerText = drawnCard.i;
        document.getElementById(`cardName-${slotIndex}`).innerText = drawnCard.n;
        
        displayCard.classList.add('pop-in');

        if (selectedCardsData.length === 3) {
            setTimeout(() => {
                document.getElementById('deckContainer').classList.add('hidden');
                document.getElementById('subtitleText').innerHTML = "👆 牌陣已成，請依序點擊<br>翻開你的 <b>3</b> 張命運之牌。";
                document.getElementById('subtitleText').style.color = "var(--gold)";
            }, 500); 
        }
    }

    function flipCard(index) {
        let cardElement = document.getElementById(`card-${index}`);
        if (!cardElement.classList.contains('pop-in') || cardElement.classList.contains('is-flipped')) return;

        cardElement.classList.add('is-flipped');
        flippedCount++;

        if (flippedCount === 3) {
            document.getElementById('subtitleText').innerHTML = "✨ 宇宙的指引已為你解開 ✨";
            
            setTimeout(() => {
                // 自動將對應的牌，套入對應領域的詳盡分析
                document.getElementById('namePast').innerText = '第 1 張：' + selectedCardsData[0].n;
                document.getElementById('descPast').innerText = selectedCardsData[0].c; // 讀取 Career
                
                document.getElementById('namePresent').innerText = '第 2 張：' + selectedCardsData[1].n;
                document.getElementById('descPresent').innerText = selectedCardsData[1].l; // 讀取 Love
                
                document.getElementById('nameFuture').innerText = '第 3 張：' + selectedCardsData[2].n;
                document.getElementById('descFuture').innerText = selectedCardsData[2].f; // 讀取 Family

                document.getElementById('analysisContainer').style.display = 'flex';
            }, 1000); 
        }
    }

    function resetAll() {
        document.getElementById('analysisContainer').style.display = 'none';
        document.getElementById('subtitleText').style.color = "#8a9ba8";
        
        for(let i=0; i<3; i++) {
            let cardElement = document.getElementById(`card-${i}`);
            cardElement.classList.remove('is-flipped');
            cardElement.classList.remove('pop-in');
            document.getElementById(`slot-${i}`).style.opacity = '1';
        }
        
        setTimeout(() => {
            initDeck();
        }, 500);
    }
</script>
