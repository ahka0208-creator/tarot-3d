<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌌 塔羅全方位運程 (沉浸抽卡版)</title>
    <style>
        :root {
            --bg-dark: #07080a;
            --bg-light: #1a222c;
            --gold: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.4);
            --text-main: #c5c6c7;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at top center, var(--bg-light) 0%, var(--bg-dark) 100%);
            color: var(--text-main);
            margin: 0;
            padding: 20px 10px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        h2 {
            color: var(--gold);
            text-align: center;
            font-size: 24px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--gold-glow);
            margin-top: 5px;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #8a9ba8;
            margin-bottom: 20px;
            line-height: 1.5;
            height: 42px; /* 固定高度防止跳動 */
        }

        /* 3張牌的牌陣排版 */
        .spread-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 20px;
            z-index: 10;
        }

        .card-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .position-label {
            color: var(--gold);
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--gold);
            padding-bottom: 3px;
        }

        .scene {
            width: 100%;
            aspect-ratio: 2 / 3.2; /* 塔羅牌比例 */
            perspective: 1000px;
            position: relative;
        }

        /* 空槽位設計 */
        .empty-slot {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px dashed rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgba(212, 175, 55, 0.5);
            font-size: 12px;
            box-sizing: border-box;
            transition: opacity 0.3s;
        }

        /* 實際卡牌設計 */
        .card {
            width: 100%;
            height: 100%;
            position: absolute;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            border-radius: 8px;
            display: none; /* 預設隱藏，抽中才顯示 */
        }

        .pop-in {
            display: block;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .card.is-flipped {
            transform: translateY(-10px) rotateY(180deg) scale(1.05);
            box-shadow: 0 15px 25px var(--gold-glow);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid var(--gold);
            box-sizing: border-box;
        }

        .card-face-back {
            background: linear-gradient(135deg, #111 0%, #2b1b3d 100%);
            background-image: repeating-linear-gradient(45deg, rgba(212,175,55,0.05) 0, rgba(212,175,55,0.05) 2px, transparent 2px, transparent 6px);
        }

        .mystic-circle {
            width: 40px;
            height: 40px;
            border: 1px dashed var(--gold);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }

        .card-face-front {
            background: #fdfbf7;
            transform: rotateY(180deg);
            color: #111;
            padding: 5px;
        }

        .card-image-placeholder { font-size: 40px; margin-bottom: 5px; }
        .card-name {
            font-size: 11px; font-weight: bold; color: #2b1b3d;
            text-align: center; border-top: 1px solid var(--gold);
            border-bottom: 1px solid var(--gold); padding: 2px 0; width: 90%;
        }

        /* 扇形牌堆區 (The Deck) */
        .deck-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 160px;
            margin-top: 10px;
            overflow: hidden;
            transition: opacity 0.8s, transform 0.8s;
        }

        .deck-container.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px);
        }

        .deck-card {
            position: absolute;
            bottom: -30px;
            left: 50%;
            width: 40px;
            height: 70px;
            background: linear-gradient(135deg, #111 0%, #2b1b3d 100%);
            border: 1px solid rgba(212,175,55,0.6);
            border-radius: 4px;
            transform-origin: bottom center;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.4s ease, margin-bottom 0.2s;
            box-shadow: -2px 0 5px rgba(0,0,0,0.5);
        }

        .deck-card:hover {
            margin-bottom: 15px;
            border-color: #fff;
            box-shadow: 0 0 10px var(--gold-glow);
            z-index: 100 !important;
        }

        .deck-card.drawn {
            opacity: 0;
            transform: translateY(-50px) scale(0.5) !important;
            pointer-events: none;
        }

        /* 深度分析區 */
        .analysis-section {
            width: 100%;
            max-width: 500px;
            background: rgba(31, 40, 51, 0.85);
            border-left: 3px solid var(--gold);
            padding: 20px 15px;
            border-radius: 0 10px 10px 0;
            margin-top: 10px;
            margin-bottom: 30px;
            display: none;
            box-sizing: border-box;
            animation: fadeIn 1s forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .analysis-block { margin-bottom: 22px; }
        .analysis-block:last-child { margin-bottom: 0; }
        .block-title {
            color: var(--gold); font-size: 16px; font-weight: bold;
            margin-bottom: 8px; display: flex; align-items: center; gap: 5px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2); padding-bottom: 5px;
        }
        .block-card-name {
            font-size: 15px; font-weight: bold; color: #fff; margin-bottom: 6px;
            display: inline-block; background: rgba(212, 175, 55, 0.2);
            padding: 2px 8px; border-radius: 5px;
        }
        .block-desc { font-size: 15px; line-height: 1.6; color: #d1d5db; }

        .action-btn {
            background: transparent;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            max-width: 250px;
            display: none; /* 預設隱藏 */
            margin: 20px auto 0 auto;
        }
        .action-btn:hover { background: var(--gold); color: #0b0c10; }

    </style>
</head>
<body>

    <h2>🌌 塔羅全方位運程</h2>
    <div class="subtitle" id="subtitleText">深呼吸，請從下方 78 張牌陣中<br>憑直覺抽出 <b>3</b> 張屬於你的牌。</div>

    <!-- 牌陣區 -->
    <div class="spread-container" id="spreadContainer">
        <!-- 領域 1：事業 -->
        <div class="card-wrapper">
            <div class="position-label">💼 事業學業</div>
            <div class="scene">
                <div class="empty-slot" id="slot-0">抽取 1</div>
                <div class="card" id="card-0" onclick="flipCard(0)">
                    <div class="card-face card-face-back"><div class="mystic-circle">🔯</div></div>
                    <div class="card-face card-face-front">
                        <div class="card-image-placeholder" id="cardIcon-0"></div>
                        <div class="card-name" id="cardName-0"></div>
                    </div>
                </div>
            </div>
        </div>
        <!-- 領域 2：感情 -->
        <div class="card-wrapper">
            <div class="position-label">❤️ 感情緣份</div>
            <div class="scene">
                <div class="empty-slot" id="slot-1">抽取 2</div>
                <div class="card" id="card-1" onclick="flipCard(1)">
                    <div class="card-face card-face-back"><div class="mystic-circle">🔯</div></div>
                    <div class="card-face card-face-front">
                        <div class="card-image-placeholder" id="cardIcon-1"></div>
                        <div class="card-name" id="cardName-1"></div>
                    </div>
                </div>
            </div>
        </div>
        <!-- 領域 3：生活 -->
        <div class="card-wrapper">
            <div class="position-label">🏡 家庭生活</div>
            <div class="scene">
                <div class="empty-slot" id="slot-2">抽取 3</div>
                <div class="card" id="card-2" onclick="flipCard(2)">
                    <div class="card-face card-face-back"><div class="mystic-circle">🔯</div></div>
                    <div class="card-face card-face-front">
                        <div class="card-image-placeholder" id="cardIcon-2"></div>
                        <div class="card-name" id="cardName-2"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 真實 78 張扇形牌堆 -->
    <div class="deck-container" id="deckContainer">
        <!-- JS 動態生成 78 張牌 -->
    </div>

    <!-- 解析區 -->
    <div class="analysis-section" id="analysisSection">
        <div class="analysis-block">
            <div class="block-title">💼 【事業與學業發展】</div>
            <div class="block-card-name" id="namePast"></div>
            <div class="block-desc" id="descPast"></div>
        </div>
        <div class="analysis-block">
            <div class="block-title">❤️ 【感情與人際緣份】</div>
            <div class="block-card-name" id="namePresent"></div>
            <div class="block-desc" id="descPresent"></div>
        </div>
        <div class="analysis-block">
            <div class="block-title">🏡 【家庭與整體生活】</div>
            <div class="block-card-name" id="nameFuture"></div>
            <div class="block-desc" id="descFuture"></div>
        </div>
        <button class="action-btn" id="resetBtn" onclick="resetAll()">🔄 重新洗牌測算</button>
    </div>

    let deckCopy = [];
    let selectedCardsData = [];
    let flippedCount = 0;

    // 頁面載入時初始化 78 張牌陣
    window.onload = function() {
        initDeck();
    };

    function initDeck() {
        const deckContainer = document.getElementById('deckContainer');
        deckContainer.innerHTML = '';
        deckContainer.classList.remove('hidden');
        deckCopy = [...tarotDeck];
        selectedCardsData = [];
        flippedCount = 0;

        document.getElementById('subtitleText').innerHTML = "深呼吸，請從下方 78 張牌陣中<br>憑直覺抽出 <b>3</b> 張屬於你的牌。";

        // 動態生成 78 張扇形展開的牌
        for (let i = 0; i < 78; i++) {
            let card = document.createElement('div');
            card.className = 'deck-card';
            card.style.zIndex = i;
            
            // 計算扇形角度與位置 (呈現完美弧度)
            let angle = -65 + (i * (130 / 77)); // 從 -65度 到 65度
            card.style.transform = `translateX(-50%) rotate(${angle}deg) translateY(-10px)`;
            
            card.onclick = function() { drawCardFromDeck(card); };
            deckContainer.appendChild(card);
        }
    }

    function drawCardFromDeck(cardElement) {
        if (selectedCardsData.length >= 3) return; // 抽滿 3 張就停止

        // 視覺上讓被點擊的牌消失
        cardElement.classList.add('drawn');

        // 從資料庫隨機分配一張真實的牌
        let randomIndex = Math.floor(Math.random() * deckCopy.length);
        let drawnCard = deckCopy.splice(randomIndex, 1)[0];
        selectedCardsData.push(drawnCard);

        let slotIndex = selectedCardsData.length - 1;

        // 隱藏虛線空槽，彈出真實牌背
        document.getElementById(`slot-${slotIndex}`).style.opacity = '0';
        let displayCard = document.getElementById(`card-${slotIndex}`);
        
        // 寫入卡牌資料 (面向背面，玩家睇唔到)
        document.getElementById(`cardIcon-${slotIndex}`).innerText = drawnCard.i;
        document.getElementById(`cardName-${slotIndex}`).innerText = drawnCard.n;
        
        // 加入彈出動畫
        displayCard.classList.add('pop-in');

        // 當抽滿 3 張時
        if (selectedCardsData.length === 3) {
            setTimeout(() => {
                document.getElementById('deckContainer').classList.add('hidden');
                document.getElementById('subtitleText').innerHTML = "👆 牌陣已成，請依序點擊<br>翻開你的 <b>3</b> 張命運之牌。";
                document.getElementById('subtitleText').style.color = "var(--gold)";
            }, 500); // 稍微延遲讓牌陣消失
        }
    }

    function flipCard(index) {
        let cardElement = document.getElementById(`card-${index}`);
        
        // 如果未抽到該位置的牌，或已經翻開，就不做任何事
        if (!cardElement.classList.contains('pop-in') || cardElement.classList.contains('is-flipped')) return;

        // 翻開卡牌
        cardElement.classList.add('is-flipped');
        flippedCount++;

        // 當三張牌都翻開後，顯示深度分析
        if (flippedCount === 3) {
            document.getElementById('subtitleText').innerHTML = "✨ 宇宙的指引已為你解開 ✨";
            
            setTimeout(() => {
                // 填入解析文字
                document.getElementById('namePast').innerText = selectedCardsData[0].n;
                document.getElementById('descPast').innerText = selectedCardsData[0].m;
                
                document.getElementById('namePresent').innerText = selectedCardsData[1].n;
                document.getElementById('descPresent').innerText = selectedCardsData[1].m;
                
                document.getElementById('nameFuture').innerText = selectedCardsData[2].n;
                document.getElementById('descFuture').innerText = selectedCardsData[2].m;

                // 顯示解析區塊與重置按鈕
                document.getElementById('analysisSection').style.display = 'block';
                document.getElementById('resetBtn').style.display = 'block';
            }, 1000); 
        }
    }

    function resetAll() {
        document.getElementById('analysisSection').style.display = 'none';
        document.getElementById('resetBtn').style.display = 'none';
        document.getElementById('subtitleText').style.color = "#8a9ba8";
        
        // 重置上方 3 張牌
        for(let i=0; i<3; i++) {
            let cardElement = document.getElementById(`card-${i}`);
            cardElement.classList.remove('is-flipped');
            cardElement.classList.remove('pop-in');
            document.getElementById(`slot-${i}`).style.opacity = '1';
        }
        
        // 延遲重新生成 78 張牌陣
        setTimeout(() => {
            initDeck();
        }, 500);
    }
</script>
